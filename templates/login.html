<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Analytics Portal Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                "on-tertiary-fixed-variant": "#3a485c",
                "on-surface": "#191c1e",
                "inverse-on-surface": "#eff1f3",
                "on-background": "#191c1e",
                "on-error-container": "#93000a",
                "primary-container": "#2563eb",
                "primary-fixed": "#dbe1ff",
                "inverse-surface": "#2d3133",
                "on-tertiary-container": "#eaf0ff",
                "secondary-fixed": "#89f5e7",
                "surface-tint": "#0053db",
                "primary": "#004ac6",
                "on-primary": "#ffffff",
                "tertiary-container": "#606e84",
                "surface-container-lowest": "#ffffff",
                "surface-container-low": "#f2f4f6",
                "outline": "#737686",
                "error-container": "#ffdad6",
                "on-secondary-fixed-variant": "#005049",
                "surface-container": "#eceef0",
                "secondary-fixed-dim": "#6bd8cb",
                "secondary": "#006a61",
                "outline-variant": "#c3c6d7",
                "tertiary-fixed": "#d5e3fd",
                "surface-bright": "#f7f9fb",
                "on-primary-fixed-variant": "#003ea8",
                "surface": "#f7f9fb",
                "secondary-container": "#86f2e4",
                "surface-variant": "#e0e3e5",
                "on-secondary": "#ffffff",
                "surface-dim": "#d8dadc",
                "on-primary-fixed": "#00174b",
                "tertiary": "#48566b",
                "on-secondary-fixed": "#00201d",
                "on-error": "#ffffff",
                "on-primary-container": "#eeefff",
                "primary-fixed-dim": "#b4c5ff",
                "on-surface-variant": "#434655",
                "error": "#ba1a1a",
                "surface-container-high": "#e6e8ea",
                "background": "#f7f9fb",
                "tertiary-fixed-dim": "#b9c7e0",
                "on-tertiary-fixed": "#0d1c2f",
                "on-secondary-container": "#006f66",
                "surface-container-highest": "#e0e3e5",
                "on-tertiary": "#ffffff",
                "inverse-primary": "#b4c5ff"
          },
          "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
          },
          "spacing": {
                "max-width": "1440px",
                "margin-mobile": "16px",
                "base": "8px",
                "margin-desktop": "32px",
                "gutter": "24px"
          },
          "fontFamily": {
                "label-sm": ["JetBrains Mono"],
                "display-lg": ["Hanken Grotesk"],
                "body-md": ["Hanken Grotesk"],
                "title-md": ["Hanken Grotesk"],
                "headline-lg-mobile": ["Hanken Grotesk"],
                "headline-lg": ["Hanken Grotesk"]
          },
          "fontSize": {
                "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
          }
        }
      }
    }
</script>
</head>
<body class="bg-surface-container-low min-h-screen flex flex-col font-body-md text-on-surface antialiased">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim w-full top-0 sticky z-50">
<div class="flex items-center justify-center px-margin-desktop py-4 w-full max-w-max-width mx-auto gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" style="font-size: 28px;">restaurant</span>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed tracking-tight">Analytics Portal</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-max-width mx-auto">
<!-- Login Card -->
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant/30 rounded-lg shadow-[0_4px_4px_rgba(0,0,0,0.02)] p-8 md:p-10 flex flex-col gap-6">
<!-- Brand & Heading -->
<div class="flex flex-col items-center text-center gap-4">
<div class="w-20 h-20 rounded-xl overflow-hidden bg-surface-container flex items-center justify-center p-2">
<img alt="Restaurant Daily Analytics Portal logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLukbVPx3QA5mlX9rGtd6hMrzOJfma5n4tKZcw8gydJ0BPP0j7awfNrgXl9AqJKXqK80oml399D4mdyFxuFqr51VRFExq15vjXtP57bRjRQxpGD72HzY5ilqgLzr8iFPtiTepXy53qxlVUaaTZXUapjTOgao4lw4nKx6yhXmlNohO3VQFD0V04Ou9UstlbBVLfqX8foYFsuSOnmraqtIbCKkB2R5Gnv8WXV6tnYCs1EKbucjC0pCgWefWmQT"/>
</div>
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Analytics Portal Login</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Secure B2B Access</p>
</div>
</div>

<!-- Dynamic Error Banner -->
{% if error %}
<div class="bg-error-container border border-error/20 rounded py-3 px-4 flex items-center gap-3">
<span class="material-symbols-outlined text-on-error-container" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-label-sm text-label-sm text-on-error-container">{{ error }}</p>
</div>
{% endif %}

<!-- Form Area -->
<form class="flex flex-col gap-6" action="/login" method="POST">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface uppercase" for="passkey">Passkey</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm" id="passkey" name="passkey" placeholder="Enter Passkey or Admin Key" type="password" required autofocus/>
</div>
<button class="w-full bg-primary hover:bg-primary-fixed-variant text-on-primary font-title-md text-title-md rounded-lg py-3 px-6 shadow-sm hover:shadow transition-all flex items-center justify-center gap-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface-container-low dark:bg-surface-container-lowest border-t border-outline-variant dark:border-outline w-full bottom-0 mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center px-margin-desktop py-6 max-w-max-width mx-auto gap-4">
<p class="font-label-sm text-label-sm font-bold text-on-surface text-center md:text-left">
    © 2026 Restaurant Analytics Group. Secure B2B Access.
</p>
<nav class="flex items-center gap-6">
<a class="font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed underline transition-all duration-200" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed underline transition-all duration-200" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant hover:text-primary dark:hover:text-primary-fixed underline transition-all duration-200" href="#">Support</a>
</nav>
</div>
</footer>
</body>
</html>
