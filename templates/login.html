<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Login - Restaurant Daily Analytics Portal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#004ac6",
                        "surface-bright": "#f7f9fb",
                        "surface-container-high": "#e6e8ea",
                        "on-surface": "#191c1e",
                        "on-surface-variant": "#434655",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6"
                    },
                    fontFamily: {
                        "body-md": ["Hanken Grotesk"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-bright font-body-md min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-[16px] shadow-[0_8px_24px_rgba(0,0,0,0.06)] w-full max-w-md border border-surface-container-high">
        <div class="text-center mb-8">
            <!-- LOGO HERE -->
            <img alt="Logo" class="w-20 h-20 mx-auto mb-4 object-contain rounded-lg" src="/static/AnK%20Logo.png"/>
            
            <h1 class="text-2xl font-bold text-primary">Analytics Portal</h1>
            <p class="text-on-surface-variant mt-2">Enter your passkey to continue</p>
        </div>
        
        <form method="POST" action="/login" class="flex flex-col gap-4">
            <div>
                <label for="passkey" class="block text-sm font-semibold text-on-surface mb-1">Passkey</label>
                <input type="password" id="passkey" name="passkey" required 
                       class="w-full px-4 py-2 border border-[#c3c6d7] rounded-lg focus:ring-2 focus:ring-primary focus:outline-none transition-colors"
                       placeholder="Enter your passkey">
            </div>
            
            {% if error %}
            <div class="bg-error-container text-error px-4 py-2 rounded-lg text-sm font-medium">
                {{ error }}
            </div>
            {% endif %}
            
            <button type="submit" class="w-full bg-primary text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition-colors mt-2 shadow-sm">
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
